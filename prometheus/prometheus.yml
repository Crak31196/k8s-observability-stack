global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # brancz/prometheus-example-app - public demo app built to expose
  # Prometheus metrics (request counts, latencies) for testing/demos.
  - job_name: "demo-app"
    static_configs:
      - targets: ["demo-app:8080"]
        labels:
          service: "demo-app"
          tier: "application"

  # Host/node level metrics (CPU, memory, disk, restarts, etc.)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          tier: "infrastructure"
