version: "3.8"

# Kubernetes Observability & Alerting Stack
# ------------------------------------------
# A local, fully runnable demo of a production-style monitoring stack:
# Prometheus (metrics) -> Alertmanager (routing/notification)
# Grafana (dashboards) scrapes/queries Prometheus.
# demo-app is a well-known PUBLIC image built specifically to expose
# Prometheus metrics for demos/tests (brancz/prometheus-example-app) -
# no custom application code is written or maintained in this repo.

networks:
  observability:
    name: observability

volumes:
  prometheus_data:
    name: k8s_observability_prometheus_data
  grafana_data:
    name: k8s_observability_grafana_data
  alertmanager_data:
    name: k8s_observability_alertmanager_data

services:
  demo-app:
    image: quay.io/brancz/prometheus-example-app:v0.5.0
    container_name: demo-app
    restart: unless-stopped
    ports:
      - "${DEMO_APP_PORT:-8080}:8080"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - demo-app
      - node-exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
