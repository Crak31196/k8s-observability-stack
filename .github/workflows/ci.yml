name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint YAML and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 140}}}" \
            docker-compose.yml \
            prometheus/prometheus.yml \
            prometheus/alert.rules.yml \
            alertmanager/alertmanager.yml \
            grafana/provisioning/datasources/datasource.yml \
            grafana/provisioning/dashboards/dashboard.yml \
            .github/workflows/ci.yml

      - name: shellcheck
        run: shellcheck scripts/remediate-restart-loop.sh tests/smoke-test.sh

  smoke-test:
    name: Bring up stack and run smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Run smoke test (brings stack up and tears it down)
        run: |
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs || true
