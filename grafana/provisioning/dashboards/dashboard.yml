# Dashboards-as-code: auto-load any dashboard JSON dropped in
# /var/lib/grafana/dashboards (mounted from ./grafana/dashboards).
apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: "Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
